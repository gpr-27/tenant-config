services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: config
      POSTGRES_USER: config
      POSTGRES_PASSWORD: config
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U config -d config"]
      interval: 2s
      timeout: 2s
      retries: 30

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    environment:
      CONFIG_DB_URL: jdbc:postgresql://postgres:5432/config
      CONFIG_DB_USER: config
      CONFIG_DB_PASSWORD: config
      CONFIG_JWT_SECRET: change-me-in-production-this-is-only-for-the-demo-compose-file
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  booking-service:
    build:
      context: .
      dockerfile: booking-service-demo/Dockerfile
    environment:
      CONFIG_SERVER_URL: http://config-server:8080
      BOOKING_SERVICE_USER: booking-svc
      BOOKING_SERVICE_PASSWORD: svc
    ports:
      - "8081:8081"
    volumes:
      - booking-data:/data
    depends_on:
      - config-server

volumes:
  booking-data:
